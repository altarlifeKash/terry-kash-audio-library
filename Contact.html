<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | The Terry Kashian Library</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .contact-card { max-width: 760px; margin: 2rem auto; padding: 2rem; border: 2px solid #d4af55; border-radius: 18px; background: #fffaf0; }
    .contact-card h1 { color: #681f32; }
    .contact-form { display: grid; gap: 1rem; margin-top: 1.5rem; }
    .contact-form label { display: grid; gap: .4rem; color: #681f32; font-weight: 700; }
    .contact-form input, .contact-form select, .contact-form textarea { box-sizing: border-box; width: 100%; padding: .8rem; border: 1px solid #b89a55; border-radius: 8px; font: inherit; }
    .contact-form textarea { min-height: 120px; }
    .payment-fields { padding: 1rem; border: 1px solid #d4af55; border-radius: 12px; }
    .success { padding: 1rem; margin-bottom: 1rem; border-left: 4px solid #25834b; background: #edf8ef; color: #1e5d35; font-weight: 700; }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="library.html">
      <span class="brand-mark">TK</span>
      <span>The Terry Kashian Library</span>
    </a>
    <a class="back-link" href="library.html">← Back to Library</a>
  </header>

  <main>
    <section class="contact-card">
      <div class="success" id="success" hidden>
        Thank you. Your confirmation has been sent to Terry. Your digital edition will be delivered within 24 hours after payment is confirmed.
      </div>

      <p class="eyebrow" id="kicker">Connect</p>
      <h1 id="title">I'd Love to Hear From You</h1>
      <p id="intro">Send a message directly to Terry Kashian.</p>

      <form class="contact-form" action="https://formspree.io/f/myezgjqz" method="POST">
        <input type="hidden" name="_next" value="https://terrykashlibrary.com/Contact.html?sent=1" />
        <input type="hidden" name="_subject" id="subject" value="Message from The Terry Kashian Library" />
        <input type="hidden" name="Book Purchased" id="book" value="" />

        <label>Your name
          <input type="text" name="Name" required />
        </label>

        <label>Your email address
          <input type="email" name="Email" required />
        </label>

        <div class="payment-fields" id="payment-fields" hidden>
          <label>Payment method
            <select name="Payment Method" id="method">
              <option value="">Choose one</option>
              <option>Zelle</option>
              <option>Cash App</option>
              <option>Venmo</option>
            </select>
          </label>

          <label>Name used for payment
            <input type="text" name="Payment Name" id="payment-name" />
          </label>
        </div>

        <label>Message
          <textarea name="Message" id="message" required></textarea>
        </label>

        <button class="bandcamp-button" type="submit" id="send">Send Message</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>© The Terry Kashian Library</p>
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const books = {
      blueprint: "The Blueprint",
      "the-blueprint": "The Blueprint",
      assembly: "The Misunderstood Assembly",
      "misunderstood-assembly": "The Misunderstood Assembly",
      "empowered-for-purpose": "Empowered for Purpose"
    };
    const book = books[params.get("purchase")];

    if (params.get("sent") === "1") {
      document.getElementById("success").hidden = false;
    }

    if (book) {
      document.getElementById("kicker").textContent = "Payment Confirmation";
      document.getElementById("title").textContent = book + " Payment Confirmation";
      document.getElementById("intro").textContent = "Complete this form after sending your $10 payment. Terry will confirm it and send your private digital edition within 24 hours.";
      document.getElementById("subject").value = book + " Payment Confirmation";
      document.getElementById("book").value = book;
      document.getElementById("payment-fields").hidden = false;
      document.getElementById("method").required = true;
      document.getElementById("payment-name").required = true;
      document.getElementById("message").value = "I have sent my $10 payment for " + book + ".";
      document.getElementById("send").textContent = "Send Payment Confirmation";
    }
  </script>
</body>
</html>
