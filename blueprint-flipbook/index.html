<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>The Blueprint — Animated Flipbook</title>
<style>
:root{--wine:#4a0b1b;--blue:#071d4a;--gold:#cdaa4a;--ivory:#fbf7ec}*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:radial-gradient(circle at 50% 20%,#17366f,#071d4a 43%,#260713);font-family:Georgia,serif;color:var(--ivory)}
.shell{height:100%;display:flex;flex-direction:column}.bar{min-height:58px;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(20,4,15,.88);border-bottom:1px solid rgba(205,170,74,.65)}.title b{color:#f0d57f;letter-spacing:.06em}.title small{display:block;opacity:.75;margin-top:2px}.tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}button,.pdf{border:1px solid #cdaa4a;background:#fbf7ec;color:#3b0d19;border-radius:999px;padding:7px 11px;font:600 12px Georgia,serif;text-decoration:none;cursor:pointer}#count{min-width:76px;text-align:center;color:#f2dc99;font-size:12px}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:16px;perspective:2600px}.book{position:relative;width:min(91vw,1120px);aspect-ratio:17/11;filter:drop-shadow(0 22px 28px rgba(0,0,0,.55))}.spread{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr}.leaf{position:relative;background:var(--ivory);overflow:hidden}.leaf.left{box-shadow:inset -14px 0 22px -18px #000}.leaf.right{box-shadow:inset 14px 0 22px -18px #000}.leaf img{width:100%;height:100%;object-fit:fill;display:block;user-select:none;-webkit-user-drag:none}.spine{position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-1px);background:linear-gradient(#a78636,#eee0a5,#6f551a);z-index:8;opacity:.65}
.covermode .left{visibility:hidden}.covermode .right{grid-column:2}.covermode .spine{opacity:0}
.flipper{position:absolute;top:0;width:50%;height:100%;z-index:20;transform-style:preserve-3d;pointer-events:none;display:none}.flipper.forward{right:0;transform-origin:left center}.flipper.backward{left:0;transform-origin:right center}.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--ivory);overflow:hidden}.face img{width:100%;height:100%;object-fit:fill}.face.back{transform:rotateY(180deg)}.forward.go{display:block;animation:turnForward .82s cubic-bezier(.3,.02,.18,1) forwards}.backward.go{display:block;animation:turnBack .82s cubic-bezier(.3,.02,.18,1) forwards}@keyframes turnForward{0%{transform:rotateY(0)}45%{filter:brightness(.78)}100%{transform:rotateY(-180deg)}}@keyframes turnBack{0%{transform:rotateY(0)}45%{filter:brightness(.78)}100%{transform:rotateY(180deg)}}
.edge{position:absolute;top:0;bottom:0;width:12%;z-index:30;cursor:pointer}.edge.prev{left:0}.edge.next{right:0}.hint{position:absolute;bottom:-25px;width:100%;text-align:center;font-size:11px;color:#e8dcae;opacity:.8}
@media(max-width:720px),(orientation:portrait){.title small{display:none}.title b{font-size:11px}.bar{padding:6px 8px}.stage{padding:8px}.book{width:min(92vw,612px);aspect-ratio:8.5/11}.spread{display:block}.leaf.left{display:none}.leaf.right{position:absolute;inset:0}.spine{display:none}.flipper{width:100%}.flipper.forward{right:0;transform-origin:left}.flipper.backward{left:0;transform-origin:right}.hint{display:none}}
</style></head><body><div class="shell"><div class="bar"><div class="title"><b>THE BLUEPRINT: PROPHETIC PLANNING</b><small>Terry Kashian · animated book edition</small></div><div class="tools"><button id="prev">← Previous</button><span id="count">Cover</span><button id="next">Next →</button><button id="full">Full screen</button><a class="pdf" href="The_Blueprint_Print.pdf" target="_blank">PDF</a></div></div><div class="stage"><div id="book" class="book covermode"><div class="spread"><div class="leaf left"><img id="left"></div><div class="leaf right"><img id="right"></div></div><div class="spine"></div><div id="flipF" class="flipper forward"><div class="face front"><img></div><div class="face back"><img></div></div><div id="flipB" class="flipper backward"><div class="face front"><img></div><div class="face back"><img></div></div><div class="edge prev"></div><div class="edge next"></div><div class="hint">Click an edge, use Previous/Next, or press the arrow keys to turn pages.</div></div></div></div>
<script>
const TOTAL=78, mobile=()=>matchMedia('(max-width:720px),(orientation:portrait)').matches;let pos=0,busy=false;
const $=s=>document.querySelector(s),book=$('#book'),L=$('#left'),R=$('#right'),count=$('#count'),ff=$('#flipF'),fb=$('#flipB');
const src=n=>n>=1&&n<=TOTAL?`pages/page-${String(n).padStart(3,'0')}.jpg`:'';
function pages(){if(mobile())return [0,pos+1];if(pos===0)return[0,1];return[pos,pos+1]}
function paint(){let [l,r]=pages();book.classList.toggle('covermode',!mobile()&&pos===0);L.src=src(l);R.src=src(r);L.style.visibility=l?'visible':'hidden';R.style.visibility=r?'visible':'hidden';count.textContent=pos===0?'Cover':(mobile()?`Page ${pos+1}`:`Pages ${pos}–${Math.min(pos+1,TOTAL)}`)}
function next(){if(busy)return;let step=mobile()?1:2;if(pos>=TOTAL-step)return;busy=true;let current=mobile()?pos+1:(pos===0?1:pos+1), nextp=Math.min(current+step,TOTAL);ff.querySelector('.front img').src=src(current);ff.querySelector('.back img').src=src(nextp);ff.classList.add('go');setTimeout(()=>{pos=pos===0&&!mobile()?2:Math.min(pos+step,TOTAL-1);ff.classList.remove('go');paint();busy=false},820)}
function prev(){if(busy||pos===0)return;let step=mobile()?1:2;busy=true;let current=mobile()?pos+1:pos, prevp=Math.max(1,current-step);fb.querySelector('.front img').src=src(current);fb.querySelector('.back img').src=src(prevp);fb.classList.add('go');setTimeout(()=>{pos=Math.max(0,pos-step);if(!mobile()&&pos<2)pos=0;fb.classList.remove('go');paint();busy=false},820)}
$('#next').onclick=next;$('#prev').onclick=prev;$('.edge.next').onclick=next;$('.edge.prev').onclick=prev;addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();next()}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();prev()}});let x=0;book.addEventListener('touchstart',e=>x=e.touches[0].clientX,{passive:true});book.addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-x;if(d<-35)next();if(d>35)prev()},{passive:true});$('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();addEventListener('resize',paint);paint();
</script></body></html>
